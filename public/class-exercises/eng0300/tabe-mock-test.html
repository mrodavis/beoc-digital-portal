<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABE Reading Mock Test | BEOC Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--ink:#202122;--navy:#0f2a52;--navy2:#1b3a6b;--blue:#26518f;--gold:#d4a72c;--gold2:#ffd766;--soft:#eef3fb;--muted:#5d6676;--cream:#fdf6e3;--okbg:#e6f4ea;--ok:#1e7e34;--line:#d7e0ef;--badbg:#fdecea;--bad:#b00020;--card:#fff;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Lato,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;}
button{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 70px;}
.hero{background:linear-gradient(135deg,#0f2a52 0%,#26518f 100%);color:#fff;border-radius:0 0 18px 18px;padding:30px 26px 24px;margin:0 -16px 18px;}
.hero h1{margin:0 0 6px;font-size:27px;line-height:1.25;}
.hero p{margin:0;color:#d9e4f5;}
.gold{display:inline-block;background:var(--gold);color:#1b2a44;font-weight:900;border-radius:999px;padding:3px 14px;font-size:13px;letter-spacing:1.5px;margin-bottom:10px;}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(27,58,107,.08);padding:20px 22px;margin:0 0 20px;border-top:5px solid var(--blue);}
.card h2{margin:0 0 4px;color:var(--navy2);font-size:20px;}
.card h3{margin:16px 0 4px;color:var(--navy2);font-size:17px;}
.ptag{display:inline-block;background:var(--soft);color:var(--blue);font-weight:900;border-radius:8px;padding:2px 10px;font-size:13px;letter-spacing:1px;margin-bottom:6px;}
.note{background:var(--cream);border-left:4px solid var(--gold);padding:8px 14px;border-radius:6px;margin:10px 0;font-size:15px;}
.handin{background:linear-gradient(135deg,#7a5a12,#b8860b);color:#fff;border-radius:14px;padding:16px 22px;margin:0 0 20px;}
.handin b{color:#ffe9b3}
.btn{background:var(--navy2);color:#fff;border:2px solid var(--navy2);border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy2);}
.btn.ghost:hover{background:var(--soft)}
.btn.big{font-size:19px;padding:12px 26px;}
.btn.goldb{background:var(--gold);border-color:var(--gold);color:#1b2a44;}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px;}
.pick{display:grid;gap:10px;margin-top:10px;}
.pick.two{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}
.choice{display:block;width:100%;text-align:left;background:#f6f8fc;border:2px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;}
.choice:hover{border-color:var(--blue)}
.choice[aria-pressed=true]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);}
.choice b{color:var(--navy2);display:block}
.choice small{color:var(--muted);font-size:14px;display:block;line-height:1.4}
.choice .tick{float:right;font-weight:900;color:var(--blue);visibility:hidden}
.choice[aria-pressed=true] .tick{visibility:visible}
.target{background:var(--navy2);color:#fff;border-radius:12px;padding:12px 18px;margin-top:12px;}
.target b{color:var(--gold2)}
ul.rules{margin:8px 0 0;padding-left:22px}
ul.rules li{margin:4px 0}
.fine{color:var(--muted);font-size:14px}

/* ───────── test screen ───────── */
.shell{max-width:1240px;margin:0 auto;background:#fff;border:1px solid #c9d5ea;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(15,42,82,.14);}
body.testing{background:#dfe6f1}
body.testing .outer{padding:10px}
.tbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:9px 16px;flex-wrap:wrap;}
.tbar .name{font-weight:900;letter-spacing:.3px}
.tbar .name small{display:block;font-weight:400;color:#c7d6ef;font-size:13px;line-height:1.2}
.tbar .qno{margin:0 auto;text-align:center;font-weight:900;font-size:18px}
.tbar .qno small{display:block;font-weight:400;color:#c7d6ef;font-size:13px;line-height:1.2}
.timer{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:8px;padding:5px 10px;font-weight:900;font-variant-numeric:tabular-nums;}
.timer .lab{font-weight:400;font-size:13px;color:#c7d6ef}
.timer.warn{background:var(--gold);color:#1b2a44}.timer.warn .lab{color:#1b2a44}
.timer.low{background:#fff;color:var(--bad)}.timer.low .lab{color:var(--bad)}
.timer button{background:none;border:1px solid currentColor;border-radius:6px;font-size:12px;padding:1px 7px;cursor:pointer;opacity:.85}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:#f4f7fb;border-bottom:1px solid var(--line);}
.tool{background:#fff;border:2px solid var(--line);border-radius:8px;padding:5px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--navy2)}
.tool:hover{border-color:var(--blue)}
.tool[aria-pressed=true]{background:var(--gold2);border-color:var(--gold);color:#1b2a44}
.tools .sp{margin-left:auto}
.mtabs{display:none}
.split{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);height:560px;}
body.full .split{height:calc(100vh - 178px);min-height:430px}
.pane{overflow:auto;padding:18px 22px 26px;}
.ppane{border-right:1px solid var(--line);background:#fbfcfe}
.pkind{font-size:13px;font-weight:900;letter-spacing:1.2px;color:var(--blue);text-transform:uppercase}
.ptitle{font-size:21px;font-weight:900;color:var(--navy2);margin:2px 0 10px;line-height:1.3}
.pintro{background:var(--soft);border-radius:8px;padding:9px 14px;font-size:15.5px;margin:0 0 12px}
.ptext p{margin:0 0 12px;padding-left:34px;position:relative}
.ptext .pn{position:absolute;left:0;top:3px;min-width:24px;height:22px;line-height:22px;text-align:center;background:var(--soft);color:var(--blue);border-radius:6px;font-size:12.5px;font-weight:900}
.ptext h4{margin:18px 0 8px;color:var(--navy2);font-size:17.5px;border-bottom:2px solid var(--line);padding-bottom:4px}
.memo{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 14px;margin:0 0 12px;font-size:15.5px}
.memo b{display:inline-block;min-width:78px;color:var(--navy2)}
.big .ptext,.big .qbody{font-size:19.5px}
figure.chart{margin:6px 0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px 12px 6px}
figure.chart figcaption{font-weight:900;color:var(--navy2);font-size:15.5px;line-height:1.35;margin-bottom:4px}
figure.chart svg{width:100%;height:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lead{background:var(--cream);border-left:4px solid var(--gold);border-radius:6px;padding:8px 14px;margin:0 0 12px;font-size:15.5px}
.qnum{font-size:13px;font-weight:900;letter-spacing:1.2px;color:var(--blue);text-transform:uppercase}
.stem{font-weight:700;font-size:1.06em;margin:4px 0 14px;line-height:1.5}
.opt{display:flex;align-items:stretch;gap:6px;margin:8px 0}
.opt label{flex:1;display:flex;gap:12px;align-items:flex-start;background:#f6f8fc;border:2px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;}
.opt label:hover{border-color:var(--blue)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ltr{flex:none;width:30px;height:30px;line-height:26px;text-align:center;border:2px solid var(--blue);border-radius:50%;font-weight:900;color:var(--blue);background:#fff}
.opt input:checked + .ltr{background:var(--blue);color:#fff}
.opt.sel label{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt input:focus-visible + .ltr{outline:3px solid #f0a500;outline-offset:2px}
.opt.struck .otx{text-decoration:line-through;color:#8a93a3}
.opt.struck label{background:#fafbfd}
.opt .x{flex:none;width:40px;border:2px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:900}
.opt .x:hover{border-color:var(--bad);color:var(--bad)}
.opt .x[aria-pressed=true]{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.qhelp{color:var(--muted);font-size:14px;margin-top:12px}
.navbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#f4f7fb;border-top:1px solid var(--line);}
.navbar .mid{margin:0 auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:62%}
.dot{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);background:#fff;font-size:11.5px;font-weight:900;color:var(--muted);cursor:pointer;padding:0;line-height:22px;position:relative}
.dot.ans{background:var(--blue);border-color:var(--blue);color:#fff}
.dot.cur{outline:3px solid var(--gold);outline-offset:1px}
.dot.flg::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.navbar .btn{margin:0}
/* review grid */
.rev{padding:22px 24px 28px}
.rev h2{margin:0 0 4px;color:var(--navy2)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;margin:14px 0}
.rcell{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:8px 12px;cursor:pointer;text-align:left}
.rcell:hover{border-color:var(--blue)}
.rcell b{color:var(--navy2);white-space:nowrap}
.rcell span{font-size:13.5px;font-weight:700;text-align:right;line-height:1.25}
.rcell.un{background:var(--cream);border-color:var(--gold)}
.rcell.un span{color:#7a5a12}
.rcell.ok span{color:var(--ok)}
.rcell .f{color:#7a5a12}
/* modal + toast */
.veil{position:fixed;inset:0;background:rgba(15,42,82,.55);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:6px solid var(--gold)}
.modal h2{margin:0 0 8px;color:var(--navy2);font-size:21px}
.modal .acts{margin-top:14px;display:flex;flex-wrap:wrap;gap:4px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:8px 20px;font-weight:700;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.3)}
/* results */
.scorehero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.bignum{font-size:54px;font-weight:900;line-height:1;color:#fff}
.bignum small{font-size:22px;color:#d9e4f5;font-weight:700}
.status{font-weight:900;font-size:19px;color:var(--navy2);margin:2px 0 6px}
.meter{position:relative;height:26px;background:var(--soft);border-radius:8px;margin:44px 0 30px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:8px 4px 4px 8px;min-width:4px}
.meter .mark{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--navy);}
.meter .mark i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:12.5px;font-weight:900;white-space:nowrap;color:var(--navy2);padding-bottom:2px;text-align:center;line-height:1.2}
.meter .mark.l i{left:auto;right:0;transform:none;text-align:right;padding-right:5px}
.meter .mark.r i{left:0;transform:none;text-align:left;padding-left:6px}
.meter .mark.mine{background:var(--gold);width:4px}
.meter .mark.mine i{top:100%;bottom:auto;padding:3px 0 0;color:#7a5a12}
.meter .mark.mine.lo i{left:0;transform:none}
.meter .mark.mine.hi i{left:auto;right:0;transform:none}
.mkey{font-size:14px;color:var(--muted);margin:-18px 0 10px}
.srow{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #edf1f8}
.srow:last-child{border-bottom:0}
.srow .nm{font-weight:700;color:var(--navy2);line-height:1.3}
.srow .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:7px 4px 4px 7px}
.srow .val{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:150px}
.pill{display:inline-block;border-radius:999px;font-size:12.5px;font-weight:900;padding:1px 9px;margin-left:6px}
.pill.g{background:var(--okbg);color:var(--ok)}
.pill.r{background:var(--cream);color:#7a5a12;border:1px solid var(--gold)}
.sumbox{border:2px dashed var(--blue);border-radius:12px;padding:14px 18px;background:#f8fafd;font-size:15.5px}
.sumbox table{border-collapse:collapse;width:100%}
.sumbox td{padding:2px 8px 2px 0;vertical-align:top}
.sumbox input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px 8px;width:min(260px,100%)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
details.rq{border:2px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
details.rq[open]{border-color:var(--blue)}
details.rq summary{cursor:pointer;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.rq summary::-webkit-details-marker{display:none}
details.rq summary .n{background:var(--navy2);color:#fff;border-radius:8px;padding:1px 9px;font-weight:900}
details.rq summary .sk{color:var(--muted);font-weight:400;font-size:14.5px}
details.rq summary .res{margin-left:auto;font-weight:900}
.res.ok{color:var(--ok)}.res.no{color:var(--bad)}.res.na{color:#7a5a12}
.rbody{padding:0 16px 14px}
.ropt{border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:7px 0;background:#f6f8fc}
.ropt.right{background:var(--okbg);border-color:var(--ok)}
.ropt.mine.wrong{background:var(--badbg);border-color:var(--bad)}
.ropt .tag{font-size:12.5px;font-weight:900;border-radius:6px;padding:0 7px;margin-left:6px;white-space:nowrap}
.ropt.right .tag.c{background:var(--ok);color:#fff}
.ropt .tag.y{background:var(--navy2);color:#fff}
.ropt .why{display:block;font-size:15px;color:#33415a;margin-top:3px}
details.pshow{margin-top:8px}
details.pshow summary{cursor:pointer;color:var(--blue);font-weight:700}
details.pshow .ptext{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:8px}
a{color:var(--blue)}

@media (max-width:820px){
  body{font-size:16.5px}
  body.testing .outer{padding:0}
  .shell{border-radius:0;border-left:0;border-right:0}
  .split,body.full .split{display:block;height:auto;min-height:0}
  .mtabs{display:flex;background:#f4f7fb;border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;border:0;border-bottom:4px solid transparent;background:none;padding:10px 6px;font-weight:900;color:var(--muted);cursor:pointer}
  .mtabs button[aria-selected=true]{color:var(--navy2);border-bottom-color:var(--gold);background:#fff}
  .pane{display:none;overflow:visible;padding:16px 16px 22px}
  .pane.on{display:block}
  .ppane{border-right:0}
  .tbar .qno{order:3;flex-basis:100%;margin:0;text-align:left;font-size:16px}
  .tbar .qno small{display:inline;margin-left:8px}
  .tbar .timer{margin-left:auto}
  .navbar .mid{display:none}
  .navbar .btn{flex:1}
  .srow{grid-template-columns:1fr auto}
  .srow .track{grid-column:1 / -1;order:3}
  .srow .val{min-width:0}
  .hero h1{font-size:23px}
  .meter{margin-top:14px}
  .meter .mark:not(.mine) i{display:none}
}
@media (prefers-reduced-motion:no-preference){.choice,.opt label,.btn{transition:border-color .12s,background .12s}}
@media print{.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
</style>

#beoc-topbar *{box-sizing:border-box;font-family:inherit;}

.beoc-bs-note{display:inline-block;background:#fff7e0;color:#5a4300;border:1px solid #e0a800;border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;line-height:1.35;text-decoration:none;}

<script type="application/json" id="data">{"skills":{"main":{"name":"Main Ideas & Details","week":"Week 1"},"infer":{"name":"Inferences & Evidence","week":"Week 2"},"vocab":{"name":"Vocabulary in Context","week":"Week 3"},"struct":{"name":"Text Structure","week":"Week 4"},"pov":{"name":"Point of View & Purpose","week":"Week 5"},"arg":{"name":"Evidence & Arguments","week":"Week 6 (new)"},"data":{"name":"Charts & Data","week":"Week 7 (new)"}},"passages":[{"id":"p1","part":1,"kind":"Informational text","title":"The Doctor Who Washed His Hands","paras":["In 1846, a young Hungarian doctor named Ignaz Semmelweis became an assistant in the maternity clinic of the Vienna General Hospital in Austria. The hospital had two maternity wards. In the first ward, babies were delivered by doctors and medical students. In the second, they were delivered by midwives. The wards were in the same hospital and served the same kinds of patients. Yet the first ward had a terrible reputation, and some women begged to be sent to the second ward instead.","The women had good reason to be afraid. In the doctors' ward, about ten of every hundred new mothers died of an illness called childbed fever. In the midwives' ward, the death rate was less than half as high. Semmelweis could not stop thinking about that gap. He tested one idea after another. Was the first ward more crowded? It was not. Was the air different? It was the same. Nothing he checked could account for the difference.","The answer came from a tragedy. In 1847, another doctor at the hospital was accidentally cut with a knife during an autopsy, the examination of a dead body. He soon fell ill and died, and his illness looked just like childbed fever. Semmelweis saw a connection that the doctors around him had missed. Doctors and students often went straight from autopsies to the delivery room. Midwives never performed autopsies. Something from the dead bodies, he reasoned, was being carried to the mothers on the doctors' hands.","Semmelweis required the doctors and students in his ward to scrub their hands in a chlorine solution before examining a patient. The results were dramatic. Within a few months, deaths in the doctors' ward fell to about two in every hundred.","The numbers were striking, but they did not settle the question. Many senior doctors doubted that one cause could explain every case, and some resented the idea that their own hands were to blame. Semmelweis could not say exactly what the deadly material was, because doctors did not yet know that germs cause diseases like this one. He lost his position at the hospital in 1849. In later years he made more enemies by attacking his critics in angry letters, and he died in 1865 with his warning still widely ignored.","Only later, after scientists proved that germs cause disease, did the medical world accept what Semmelweis had seen. Today, handwashing is one of the first lessons every health care worker learns."],"questions":[{"n":1,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which statement best expresses the central idea of the passage?","options":[{"t":"The Vienna General Hospital had two maternity wards, and far more mothers died in the ward run by doctors than in the other ward.","why":"Too narrow. This is true, but it is only the starting detail from paragraphs 1 and 2. It leaves out the discovery and what happened next."},{"t":"Doctors in the 1800s did not care whether their patients lived or died.","why":"Not in the text. The passage says many doctors doubted his idea. It never says they did not care."},{"t":"Semmelweis showed that handwashing saved lives, but most doctors did not accept his discovery during his lifetime.","why":"Correct. This covers the whole passage: the discovery (paragraphs 1 to 4), the rejection (paragraph 5), and the late acceptance (paragraph 6)."},{"t":"Childbed fever was the most dangerous disease of the 1800s.","why":"Not in the text. The passage never compares childbed fever with other diseases."}],"key":2},{"n":2,"skill":"infer","domain":"KID","pair":"A","lead":"Answer the next two questions together. First, answer question 2. Then, answer question 3.","stem":"Based on paragraph 3, what can the reader conclude about why the midwives' ward was safer?","options":[{"t":"The midwives had more years of experience than the doctors.","why":"Not in the text. The passage says nothing about how experienced the midwives were."},{"t":"The midwives' ward had fewer patients and cleaner air than the doctors' ward.","why":"Paragraph 2 rules this out. Semmelweis checked crowding and air, and neither one explained the gap."},{"t":"The midwives did not carry material from dead bodies to their patients.","why":"Correct. Doctors went from autopsies to the delivery room. Midwives never performed autopsies, so their hands did not carry that material."},{"t":"The midwives washed their hands in a chlorine solution.","why":"The chlorine rule came later, and Semmelweis ordered it for the doctors' ward (paragraph 4)."}],"key":2},{"n":3,"skill":"infer","domain":"KID","pair":"B","lead":null,"stem":"Which sentence from the passage best supports the answer to question 2?","options":[{"t":"\"The wards were in the same hospital and served the same kinds of patients.\"","why":"This shows the wards were alike. It does not explain why one was safer."},{"t":"\"Midwives never performed autopsies.\"","why":"Correct. This sentence is the proof. It shows the one thing the doctors did that the midwives did not do."},{"t":"\"Was the first ward more crowded?\"","why":"This is one of the ideas Semmelweis tested and rejected. It is not the reason."},{"t":"\"The results were dramatic.\"","why":"This tells what happened after the handwashing rule. It does not explain the midwives' ward."}],"key":1},{"n":4,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"Read this sentence from paragraph 2: \"Nothing he checked could account for the difference.\" The phrase \"account for\" most nearly means","options":[{"t":"pay for","why":"This is another meaning of \"account,\" about money. Money is not the topic of this sentence."},{"t":"explain","why":"Correct. He tested crowding and air, but neither one could explain why more mothers died in the first ward."},{"t":"keep a record of","why":"This is another meaning of \"account.\" Put it in the sentence and it does not make sense."},{"t":"measure","why":"He already had the numbers. The problem was the reason behind them, not how to measure them."}],"key":1},{"n":5,"skill":"struct","domain":"CS","pair":null,"lead":null,"stem":"How does paragraph 5 contribute to the development of the passage?","options":[{"t":"It compares the two maternity wards at the hospital.","why":"That is paragraphs 1 and 2. Paragraph 5 is about how other doctors reacted."},{"t":"It shows that the handwashing rule failed to lower the death rate.","why":"The opposite is true. Paragraph 4 says deaths fell to about two in every hundred."},{"t":"It explains why the discovery was rejected even though it worked.","why":"Correct. Paragraph 5 gives the reasons: doctors doubted that one cause explained every case, some resented the blame, and he could not name the cause."},{"t":"It describes the steps Semmelweis followed to test his ideas.","why":"That is paragraph 2, where he checks crowding and air."}],"key":2},{"n":6,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"According to paragraphs 5 and 6, how did later scientists change the way the medical world saw Semmelweis's discovery?","options":[{"t":"They repeated his handwashing rule in other hospitals and found that it did not work.","why":"Not in the text. Paragraph 6 says the medical world came to accept what he had seen."},{"t":"They showed that childbed fever had never been carried on the hands of doctors.","why":"The opposite. The later proof about germs supported his idea about the doctors' hands."},{"t":"They invented the chlorine solution that Semmelweis later used in his ward.","why":"The order is wrong. Semmelweis used chlorine in 1847. The proof about germs came later."},{"t":"They proved that germs cause disease, which supplied the explanation he had lacked.","why":"Correct. In paragraph 5 he \"could not say exactly what the deadly material was.\" Paragraph 6 says acceptance came \"after scientists proved that germs cause disease.\""}],"key":3}]},{"id":"p2","part":1,"kind":"Story","title":"First Shift","paras":["Dalia had ironed her scrubs twice. Now, standing outside Room 214 with a blood pressure cuff in her hands, she wished she had spent that time practicing instead.","\"Mr. Okafor is a regular,\" the nurse had said, already walking away. \"He'll go easy on you.\"","The man in the bed did not look easy. He was reading a newspaper folded into a tight square, and he did not lower it when she came in.","\"Good morning. I'm Dalia, a student. I need to take your blood pressure.\"","\"Another student.\" He held out his arm without looking up. \"The last one pumped that thing until my fingers went purple.\"","Her hands were butterflies. She wrapped the cuff, lost the end of it, and wrapped it again. The stethoscope felt like part of a costume. She squeezed the bulb, watched the needle climb, and listened. Nothing. Only her own heartbeat, loud as a drum in her ears.","She let the air out. \"I'm sorry. I need to try once more.\"","Now the newspaper came down. Mr. Okafor studied her for a long moment. Then he reached over with his free hand and moved the stethoscope an inch toward the inside of his elbow.","\"There,\" he said. \"Forty years as a bus mechanic. You learn that you can't hear an engine if you listen in the wrong place.\"","She tried again. This time the sound arrived, soft and steady, like someone knocking politely on a door. She wrote the numbers down and read them back to him.","\"Sounds about right,\" he said. He lifted the paper again, but not all the way. \"You said you were sorry. The purple-fingers one never did. Keep that.\"","In the hallway, the nurse glanced at the chart. \"How did it go?\"","\"He helped me,\" Dalia said. She looked down at her hands. They were perfectly still."],"questions":[{"n":7,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which statement best expresses a theme of the story?","options":[{"t":"Admitting a mistake and trying again can lead to success and earn respect.","why":"Correct. Dalia says she is sorry and tries again. She gets the reading, and Mr. Okafor praises the apology: \"Keep that.\""},{"t":"Careful preparation at home guarantees success on the job.","why":"Dalia ironed her scrubs twice and still struggled. Preparation alone did not solve her problem."},{"t":"Patients usually know more about medicine than the people who treat them.","why":"Too broad. One patient helps one student one time. The story does not make a claim about all patients."},{"t":"Experienced workers should not have to deal with beginners.","why":"The story shows the opposite. Mr. Okafor chooses to help the beginner."}],"key":0},{"n":8,"skill":"infer","domain":"KID","pair":null,"lead":null,"stem":"What can the reader infer about Mr. Okafor from paragraphs 8 through 11?","options":[{"t":"He believes students should not practice on patients.","why":"He holds out his arm, lets her try twice, and helps her. That does not fit this belief."},{"t":"He is annoyed by students and wants them kept away from him.","why":"He sounds annoyed in paragraph 5, but then he chooses to help her and encourages her."},{"t":"He is kinder and more helpful than he first seems.","why":"Correct. He seems cold at first, but he moves the stethoscope for her, explains why, and gives her a compliment."},{"t":"He used to work in a hospital.","why":"He says he was a bus mechanic for forty years. He uses what he learned about engines to explain listening."}],"key":2},{"n":9,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"In paragraph 6, the author writes, \"Her hands were butterflies.\" This means that Dalia's hands were","options":[{"t":"moving with skill and confidence","why":"She fumbles the cuff, so her hands are not skilled or confident here."},{"t":"shaking because she was nervous","why":"Correct. Butterflies flutter. The next sentence shows it: she loses the end of the cuff and has to wrap it again."},{"t":"small and brightly colored","why":"This takes the comparison literally. The author means how her hands moved, not how they looked."},{"t":"cold from the air in the room","why":"Nothing in the story mentions temperature."}],"key":1},{"n":10,"skill":"struct","domain":"CS","pair":null,"lead":null,"stem":"The story ends with the sentence \"They were perfectly still.\" How does this ending connect to the rest of the story?","options":[{"t":"It shows that Dalia is calm now, unlike earlier in the story.","why":"Correct. In paragraph 6 her hands \"were butterflies.\" At the end they are still. The change shows she is calm now."},{"t":"It shows that Dalia is hiding her mistake from the nurse.","why":"She tells the nurse, \"He helped me.\" She is not hiding anything."},{"t":"It shows that Dalia is frozen with fear about her next patient.","why":"She has just succeeded and been praised. Nothing suggests new fear."},{"t":"It shows that Dalia has decided to leave the program.","why":"Nothing in the story suggests that she wants to quit."}],"key":0},{"n":11,"skill":"infer","domain":"KID","pair":null,"lead":null,"stem":"Which sentence from the story best shows that Dalia does not yet feel like a real health care worker?","options":[{"t":"\"She wrote the numbers down and read them back to him.\"","why":"This comes after she succeeds. It shows her doing the job correctly."},{"t":"\"The man in the bed did not look easy.\"","why":"This describes Mr. Okafor, not how Dalia feels about herself."},{"t":"\"The stethoscope felt like part of a costume.\"","why":"Correct. A costume is something you wear to pretend. She feels like she is only dressed as a health care worker."},{"t":"\"Mr. Okafor studied her for a long moment.\"","why":"This tells what Mr. Okafor does. It does not show Dalia's feelings about herself."}],"key":2}]},{"id":"p3","part":1,"kind":"Workplace memo with chart","title":"Proposal: Evening Hours at Northgate Family Clinic","memo":{"to":"All Staff","from":"Renee Castillo, Office Manager","subject":"Proposal to add evening hours"},"paras":["Every month, patients ask for appointments that we cannot give them. In September we tracked every request that we had to turn down, and we recorded the time of day the patient wanted. The chart shows the results.","The pattern is hard to miss. More than half of the requests we turned down were for evening visits. Our doors are closed at that time. Many of our patients work during the day. When they cannot see us after work, they go to the emergency room for care we could have given here.","I propose that we stay open until 8:00 p.m. on Tuesdays and Thursdays, beginning in January. To cover each evening, two medical assistants and one provider would shift their schedules to start later that day. No one would work more hours than they do now.","Some staff members have told me that evening hours will be hard on employees with children. That is a fair concern. For that reason, evening shifts would be offered to volunteers first, and no one would be assigned more than one evening per week.","Evening hours will not solve every scheduling problem. The chart shows that Saturday is also in demand. But two evenings a week is a change we can make with the staff we already have, and it answers the request our patients make most often."],"chart":{"afterPara":1,"title":"Appointment Requests We Could Not Fill, by Time Requested (September)","yLabel":"Number of requests","max":250,"step":50,"bars":[{"label":"Morning","sub":"8 a.m. to 12 p.m.","subShort":"8 to 12","value":40},{"label":"Afternoon","sub":"12 to 5 p.m.","subShort":"12 to 5","value":55},{"label":"Evening","sub":"5 to 8 p.m.","subShort":"5 to 8","value":210},{"label":"Saturday","sub":"any time","subShort":"any time","value":95}]},"questions":[{"n":12,"skill":"data","domain":"IKI","pair":null,"lead":null,"stem":"Which statement is supported by the information in the chart?","options":[{"t":"Morning had more unfilled requests than afternoon.","why":"Morning is 40 and afternoon is 55. Morning had fewer."},{"t":"Saturday had the fewest unfilled requests of the four times.","why":"Saturday is 95, the second tallest bar. Morning is the fewest at 40."},{"t":"Afternoon had about half as many unfilled requests as evening.","why":"Half of 210 is 105. Afternoon is only 55, which is close to one quarter."},{"t":"Evening had more than twice as many unfilled requests as Saturday.","why":"Correct. Saturday is 95, and twice 95 is 190. Evening is 210, which is more than 190."}],"key":3},{"n":13,"skill":"data","domain":"IKI","pair":null,"lead":null,"stem":"Which statement from the memo is best supported by the chart?","options":[{"t":"\"More than half of the requests we turned down were for evening visits.\"","why":"Correct. The four bars add up to 400. Evening is 210, and half of 400 is 200. So evening is more than half."},{"t":"\"To cover each evening, two medical assistants and one provider would shift their schedules to start later that day.\"","why":"This is about the staff schedule. The chart has no information about staff or their hours."},{"t":"\"No one would work more hours than they do now.\"","why":"This is a promise about the staff. The chart counts patient requests only."},{"t":"\"Many of our patients work during the day.\"","why":"This may be true, but the chart shows requested times. It does not show where patients work."}],"key":0},{"n":14,"skill":"pov","domain":"CS","pair":null,"lead":null,"stem":"How does the writer respond to staff members who are worried about evening hours?","options":[{"t":"She ignores the concern because patients matter more than staff.","why":"She gives the concern a whole paragraph and answers it."},{"t":"She says the concern is fair and describes limits meant to reduce the problem.","why":"Correct. Paragraph 4: \"That is a fair concern.\" Then she offers volunteers first and no more than one evening a week."},{"t":"She explains that the concern affects only a small number of employees.","why":"Not in the text. She never says how many employees are affected. She calls the worry fair."},{"t":"She promises extra pay to anyone who works an evening shift.","why":"Not in the text. The memo never mentions pay."}],"key":1},{"n":15,"skill":"arg","domain":"IKI","pair":null,"lead":null,"stem":"Which claim does the writer make without giving any evidence for it?","options":[{"t":"The clinic had to turn down appointment requests in September.","why":"The chart supports this. It counts 400 requests the clinic could not fill."},{"t":"Evening was the most requested time among the requests the clinic turned down.","why":"The chart supports this. Evening is the tallest bar at 210."},{"t":"Saturday appointments are also in demand.","why":"The chart supports this. Saturday is the second tallest bar at 95."},{"t":"Patients who cannot get evening visits go to the emergency room instead.","why":"Correct. The writer states this in paragraph 2 but gives no numbers or examples to prove it. The chart does not show emergency room visits."}],"key":3},{"n":16,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"In paragraph 3, the word \"shift\" most nearly means","options":[{"t":"repeat","why":"The schedule is not repeated. It starts at a different time."},{"t":"change","why":"Correct. The workers would change their schedules so they start later. In paragraph 4, \"shifts\" has a different meaning: periods of work."},{"t":"cancel","why":"The schedules are not canceled. The workers still work, only later in the day."},{"t":"share","why":"Nothing says the workers share schedules with one another."}],"key":1}]},{"id":"p4","part":1,"kind":"Science text","title":"Reading the Light: How a Pulse Oximeter Works","paras":["A nurse clips a small device onto a patient's fingertip. A few seconds later, a number appears: 98. No needle was used, and no blood was drawn. Yet that number shows how well the patient's blood is carrying oxygen. The device is called a pulse oximeter, and it works by shining light through the finger.","Blood gets its color from hemoglobin, the protein in red blood cells that carries oxygen. Hemoglobin that is loaded with oxygen is bright red. Hemoglobin that has given up its oxygen is darker. Because the two forms are different colors, they absorb light differently.","First, one side of the clip sends out two kinds of light: red light and infrared light, which human eyes cannot see. Oxygen-rich blood absorbs more of the infrared light and lets more of the red light pass. Oxygen-poor blood does the opposite. Next, a sensor on the other side of the clip measures how much of each kind of light came through the finger. Finally, the device compares the two measurements and calculates the percentage of hemoglobin that is carrying oxygen. For most healthy people, the reading falls between 95 and 100 percent.","The reading is useful, but it is not perfect. Cold fingers, poor circulation, a moving hand, and dark nail polish can all interfere with the light and produce a false number. Studies have also found that the device can be less accurate for patients with darker skin, sometimes showing a reading that is higher than the true level. For these reasons, health care workers are trained to look at the patient as well as the number. A person who is struggling to breathe needs attention, no matter what the screen says."],"questions":[{"n":17,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"In paragraph 4, the word \"interfere\" most nearly means","options":[{"t":"measure exactly","why":"The sentence says the result is false, which is the opposite of exact."},{"t":"get in the way","why":"Correct. Cold fingers and nail polish get in the way of the light, so the device produces \"a false number.\""},{"t":"work together","why":"The result is a false number, so these things are not helping the light."},{"t":"shine brightly","why":"Cold fingers and nail polish do not shine. This confuses the word with the topic of light."}],"key":1},{"n":18,"skill":"struct","domain":"CS","pair":null,"lead":null,"stem":"How is paragraph 3 mainly organized?","options":[{"t":"It compares the health of two different patients.","why":"No patients are compared. The paragraph compares two kinds of blood only to explain how the device works."},{"t":"It presents a problem and several possible solutions.","why":"Problems with the reading come in paragraph 4. Paragraph 3 explains how the device works."},{"t":"It gives an opinion and reasons to agree with it.","why":"Paragraph 3 gives facts about how the device works. It does not argue an opinion."},{"t":"It explains the steps in a process, in order.","why":"Correct. \"First\" the light is sent out, \"Next\" a sensor measures it, and \"Finally\" the device compares and calculates."}],"key":3},{"n":19,"skill":"infer","domain":"KID","pair":null,"lead":null,"stem":"A patient's pulse oximeter shows 97 percent, but the patient is gasping for breath. Based on paragraph 4, what should a health care worker conclude?","options":[{"t":"The patient must be wearing dark nail polish.","why":"Nail polish is only one possible cause. Nothing tells us it is the cause here."},{"t":"The number may be wrong, so the patient still needs attention.","why":"Correct. Paragraph 4: \"A person who is struggling to breathe needs attention, no matter what the screen says.\""},{"t":"The patient is fine because the number is in the healthy range.","why":"This trusts the number alone. Paragraph 4 warns that the number can be false."},{"t":"The device is broken and can never be trusted.","why":"Too extreme. The passage says the reading is \"useful, but it is not perfect.\""}],"key":1},{"n":20,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which sentence is the best summary of the passage?","options":[{"t":"Pulse oximeters give false readings for many patients, so hospitals should stop using them and go back to testing blood with a needle every time.","why":"This adds an opinion that is not in the passage. The passage calls the reading useful."},{"t":"Nurses like the pulse oximeter because it does not need a needle.","why":"The passage mentions that no needle is used, but it never says what nurses like. This also leaves out most of the passage."},{"t":"A pulse oximeter estimates blood oxygen by measuring light passing through a finger, and its readings are useful but can sometimes be wrong.","why":"Correct. It covers what the device does, how it works, and its limits, with no opinion added."},{"t":"Hemoglobin is the protein in red blood cells that gives blood its color.","why":"Too narrow. This is one detail from paragraph 2."}],"key":2}]},{"id":"p5","part":2,"kind":"Biography","title":"The Door Elizabeth Blackwell Opened","paras":["When Elizabeth Blackwell decided to become a doctor in the 1840s, no woman in the United States had ever earned a medical degree. Blackwell was a teacher, and at first the idea of studying medicine did not appeal to her at all. Then a dying friend told her that her suffering would have been easier to bear if her doctor had been a woman. Blackwell could not forget those words.","She applied to medical schools, and school after school turned her down. Finally, Geneva Medical College, a small school in New York State, did something unusual. The professors did not want to admit her, but they did not want to be the ones to say no. So they let the students decide, and they added a rule: if even one student objected, she would be refused. The students, all men, treated the request as a joke. In a noisy meeting they voted yes, and in the end not one vote was against her.","It is sometimes said that Blackwell became a doctor because of a joke. That is true only of the first day. A joke opened the door, but it did not carry her through it. In town, people stared at her on the street. Early on, a professor asked her to stay away from a lesson that he thought was unfit for a woman. She asked to stay, and her classmates backed her. In January 1849, she graduated first in her class.","A diploma did not end the resistance. Hospitals in New York City would not hire her, and landlords would not rent her an office. Blackwell did not wait for permission. In 1857, together with her sister Emily, who had also become a doctor, and a third woman doctor, she opened a hospital for women and children in New York City. The hospital cared for patients who could not pay, and it gave women doctors a place to train when other hospitals shut them out.","Blackwell spent only part of her life treating patients. The path she cleared lasted much longer. By the time she died in 1910, thousands of women were practicing medicine in the United States."],"questions":[{"n":21,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which sentence best states the central idea of the passage?","options":[{"t":"Blackwell was admitted to medical school only because the students treated her application as a joke and voted yes without thinking.","why":"Too narrow. This is one event from paragraph 2, and paragraph 3 argues it is not the whole story."},{"t":"By refusing to give up, Blackwell overcame repeated rejection to become a doctor and opened the way for other women.","why":"Correct. Every paragraph fits: rejection by schools, hard treatment as a student, rejection by hospitals, and the infirmary that trained other women."},{"t":"Geneva Medical College was a small school in New York State.","why":"Too narrow. This is one background detail from paragraph 2. It does not tell what the passage is mainly about."},{"t":"In the 1850s, hospitals in New York City cared only for patients who could pay.","why":"Not in the text. The passage says only that Blackwell's hospital cared for people who could not pay."}],"key":1},{"n":22,"skill":"infer","domain":"KID","pair":null,"lead":null,"stem":"What can the reader infer about the professors from their decision to let the students vote?","options":[{"t":"They needed more students so that the college could stay open.","why":"Not in the text. The passage never mentions money or the size of the school."},{"t":"They strongly supported Blackwell and hoped she would be admitted.","why":"Paragraph 2 says plainly that the professors \"did not want to admit her.\""},{"t":"They expected the students to reject Blackwell for them.","why":"Correct. They \"did not want to be the ones to say no,\" and they made the rule strict: one objection would refuse her. They were counting on a no."},{"t":"They believed that students were the best judges of who should become a doctor.","why":"Nothing supports this. The vote was a way to avoid saying no themselves."}],"key":2},{"n":23,"skill":"pov","domain":"CS","pair":null,"lead":null,"stem":"In paragraph 3, how does the author respond to the idea that Blackwell \"became a doctor because of a joke\"?","options":[{"t":"The author agrees the joke got her admitted but argues that her own effort earned the degree.","why":"Correct. \"That is true only of the first day. A joke opened the door, but it did not carry her through it.\""},{"t":"The author agrees completely and gives more examples of the joke.","why":"The author limits the idea (\"true only of the first day\") and then argues against it."},{"t":"The author says the story about the student vote is false.","why":"The author tells the vote as fact in paragraph 2. The author disagrees with what it means, not with whether it happened."},{"t":"The author blames the students for treating Blackwell unfairly.","why":"The author says her classmates backed her. The author does not blame them."}],"key":0},{"n":24,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"Read this sentence from paragraph 4: \"A diploma did not end the resistance.\" In this sentence, \"resistance\" most nearly means","options":[{"t":"people standing in her way","why":"Correct. The next sentence gives examples: hospitals would not hire her and landlords would not rent to her."},{"t":"physical strength","why":"Nothing in the paragraph is about strength."},{"t":"a long delay","why":"She was refused, not delayed. Hospitals \"would not hire her.\""},{"t":"the body's ability to fight off disease","why":"This is another meaning of \"resistance.\" The paragraph is about people refusing her, not about illness."}],"key":0},{"n":25,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which detail from the passage best supports the statement that Blackwell \"did not wait for permission\"?","options":[{"t":"She worked as a teacher before she studied medicine.","why":"This is background from paragraph 1. It is not about acting without permission."},{"t":"She helped open a new hospital in New York City.","why":"Correct. Hospitals would not hire her, so she did not wait. She helped create a place to work."},{"t":"She was admitted to the college after the students voted yes.","why":"Here she did receive permission, from the students' vote."},{"t":"People in town stared at her on the street.","why":"This shows how others treated her. It is not an action she took."}],"key":1}]},{"id":"p6","part":2,"kind":"Two letters to the editor","title":"Should Harlow City Make Its Buses Free?","intro":"Harlow City made one bus route, Route 9, free for six months as a test. Now the city council must decide what to do next. Read both letters. Then answer the questions.","texts":[{"title":"Letter 1: Make the Buses Free","paras":["I am a home health aide, and I ride three buses a day to reach my clients. Last spring, Harlow City made Route 9 free for six months as a test. I rode it every week, and I saw the difference myself.","First, the bus moved faster. Nobody stood at the front digging for coins or tapping a card that would not read. The city's own report found that Route 9 buses spent less time waiting at each stop during the test.","Second, more people rode. The same report counted about one-third more riders on Route 9 than the year before. Those riders were people going to work, to school, and to the doctor.","Critics say the city cannot afford to give up the fares. But fares pay for only a small part of what it costs to run a bus. The rest already comes from taxes. We do not charge people to walk into a library or a park. A bus that takes a worker to her job is worth at least as much.","The test worked. The city council should make every route free."]},{"title":"Letter 2: Better Buses, Not Free Buses","paras":["I drove a city bus for twenty-two years, and I want more people to ride. That is exactly why I oppose making the buses free.","Supporters point to the Route 9 test, and it is true that ridership went up. But look closer at who the new riders were. The city's report says that most of them made short trips they used to make on foot. Very few had switched from driving a car.","Meanwhile, the fares that riders pay add up to millions of dollars a year. That money could put more buses on the busiest routes. When the city asked riders what would improve their trips, the top answer was not price. It was a bus that comes on time and comes more often.","A free bus that arrives every forty minutes is no gift to a worker who has to be at her job by seven. Keep the fare, offer a discount to riders with low incomes, and spend the money on service."]}],"questions":[{"n":26,"skill":"arg","domain":"IKI","pair":null,"lead":null,"stem":"Which sentence from Letter 1 gives the strongest evidence that the free test brought more riders to Route 9?","options":[{"t":"\"I rode it every week, and I saw the difference myself.\"","why":"This is one person's experience. It is weaker than a count from a report."},{"t":"\"Those riders were people going to work, to school, and to the doctor.\"","why":"This describes the riders. It does not show that there were more of them."},{"t":"\"The city's own report found that Route 9 buses spent less time waiting at each stop during the test.\"","why":"This is from the report, but it is about speed. It is not relevant to the number of riders."},{"t":"\"The same report counted about one-third more riders on Route 9 than the year before.\"","why":"Correct. This is a counted number from the city's report. It is about the claim, and it can be checked."}],"key":3},{"n":27,"skill":"arg","domain":"IKI","pair":null,"lead":null,"stem":"Which statement describes a weakness in the argument of Letter 1?","options":[{"t":"It gives no information from the city's report.","why":"Not true. It uses the report twice: less time at each stop, and about one-third more riders."},{"t":"It never says what the writer wants the city to do.","why":"Not true. The last paragraph says the council should make every route free."},{"t":"It uses a six-month test of one route to argue that every route should be free.","why":"Correct. One route for six months may not be enough evidence for the whole city. The evidence is real, but it is not sufficient for such a large claim."},{"t":"It never mentions the critics who say the city cannot afford to give up the fares.","why":"Not true. Paragraph 4 names those critics and answers them."}],"key":2},{"n":28,"skill":"arg","domain":"IKI","pair":null,"lead":null,"stem":"On which point do the two writers disagree?","options":[{"t":"whether the Route 9 results show that free buses are worth the cost","why":"Correct. Letter 1 says \"The test worked.\" Letter 2 says the new riders were mostly people who used to walk, so the money is better spent on service."},{"t":"whether more people rode Route 9 during the test","why":"They agree on this. Letter 2 says, \"it is true that ridership went up.\""},{"t":"whether the city ran a free test on Route 9","why":"Both letters accept that the test happened."},{"t":"whether it is good for more people to ride the bus","why":"They agree. The writer of Letter 2 says, \"I want more people to ride.\""}],"key":0},{"n":29,"skill":"pov","domain":"CS","pair":null,"lead":null,"stem":"How does the writer of Letter 2 respond to the evidence that ridership went up?","options":[{"t":"The writer says that ridership went down during the test.","why":"The letter says the opposite: \"it is true that ridership went up.\""},{"t":"The writer claims that the city's report counted the Route 9 riders incorrectly.","why":"The writer uses the same report as evidence. The letter never says the report is wrong."},{"t":"The writer ignores the ridership numbers completely.","why":"Paragraph 2 of the letter discusses them directly."},{"t":"The writer accepts the fact but argues that it means less than it seems.","why":"Correct. \"It is true that ridership went up. But look closer at who the new riders were.\" The writer agrees with the number and questions its meaning."}],"key":3},{"n":30,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"In Letter 2, the writer says that a free bus that arrives every forty minutes \"is no gift\" to a worker. What does the writer mean?","options":[{"t":"A free ride is worth little if the bus does not come often enough.","why":"Correct. The worker \"has to be at her job by seven.\" A free bus that comes only every forty minutes may not get her there on time."},{"t":"A discount would save workers more money than a free ride.","why":"A discount cannot save more than a free ride. The phrase is about how often the bus comes, not about money."},{"t":"Workers who have jobs should be willing to pay the full fare.","why":"The writer is not judging workers. The letter even suggests a discount for riders with low incomes."},{"t":"The city should give presents to bus riders.","why":"This takes \"gift\" literally. The writer means \"benefit.\""}],"key":0},{"n":31,"skill":"struct","domain":"CS","pair":null,"lead":null,"stem":"How does the writer of Letter 1 organize paragraphs 2 and 3?","options":[{"t":"by comparing Harlow City with other cities","why":"No other city is mentioned."},{"t":"by describing a problem and then its solution","why":"These paragraphs give two benefits of the test. They do not describe a problem and a fix."},{"t":"by telling the events of one day in time order","why":"\"First\" and \"Second\" number the reasons here. They are not steps in a day."},{"t":"by listing reasons, each supported with information from the city's report","why":"Correct. \"First, the bus moved faster.\" \"Second, more people rode.\" Each reason is followed by a finding from the report."}],"key":3}]},{"id":"p7","part":2,"kind":"Story","title":"The Lot on Fenner Street","paras":["The summer I turned fifteen, my grandmother decided that the empty lot on Fenner Street was going to be a garden. I decided that she had lost her mind.","The lot was a rectangle of broken glass and weeds, fenced with chain link that sagged like a tired clothesline. People used it to get rid of things they did not want: a mattress, a shopping cart, a television with a cracked face. Grandma Inez stood at the gate with her hands on her hips, looking at all of it the way other people look at a menu.","\"Tomatoes there,\" she said. \"Beans along the fence.\"","\"Grandma, there's a mattress.\"","\"Then we start with the mattress.\"","I was certain no one would help. For the first week, I was right. We dragged and raked and filled bags while the neighbors watched from their stoops. I kept my head down. I did not want anyone from school to see me hauling garbage with my grandmother.","In the second week, Mr. Bell from the corner house brought over a wheelbarrow and left it without a word. Then two little kids started showing up to hunt for worms. Then their mother came, and she knew about soil. By July, I could not have told you whose garden it was.","The tomatoes came in August, more than we could eat. Grandma Inez put a basket by the gate with a sign: TAKE WHAT YOU NEED. I thought the basket would be stolen. It was empty every evening and still there every morning, and sometimes there was something new in it. Once it was a jar of peppers. Once it was a pair of garden gloves, my size.","I am grown now, and I have lived in four cities. In every one, I find the lot that everyone else has given up on, and I stand at the gate with my hands on my hips."],"questions":[{"n":32,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which statement best expresses a theme of the story?","options":[{"t":"Young people should always obey their grandparents.","why":"The narrator helps, but the story is about what the garden became, not about obeying."},{"t":"Growing your own food is the best way to save money.","why":"Money is never mentioned. The tomatoes are given away."},{"t":"One person's steady effort can draw a community together.","why":"Correct. Grandma Inez starts alone. One neighbor at a time joins, until the narrator cannot say \"whose garden it was.\""},{"t":"Cities should pay workers to clean up empty lots.","why":"The story is not about what cities should do. No one is paid."}],"key":2},{"n":33,"skill":"pov","domain":"CS","pair":null,"lead":null,"stem":"How does the narrator's view of the grandmother and her plan change from the beginning of the story to the end?","options":[{"t":"The narrator goes from doubting the grandmother to seeing the world the way she did.","why":"Correct. At first: \"she had lost her mind.\" At the end, the narrator stands at a gate \"with my hands on my hips,\" just as she did."},{"t":"The narrator goes from enjoying the garden to resenting the work.","why":"The change goes the other way. The narrator starts out embarrassed and ends up carrying on the work."},{"t":"The narrator goes from trusting the neighbors to being afraid of them.","why":"The narrator starts out doubting the neighbors and learns they can be trusted."},{"t":"The narrator's opinion of the grandmother stays exactly the same from the first paragraph to the last.","why":"It changes completely, from \"she had lost her mind\" to copying her as an adult."}],"key":0},{"n":34,"skill":"infer","domain":"KID","pair":"A","lead":"Answer the next two questions together. First, answer question 34. Then, answer question 35.","stem":"What can the reader infer about the neighbors by the end of the summer?","options":[{"t":"They took the tomatoes but gave nothing in return.","why":"Paragraph 8 shows the opposite. Things appear in the basket: peppers, garden gloves."},{"t":"They helped with the work only because Grandma Inez paid them for it.","why":"Not in the text. No one is paid. Mr. Bell leaves the wheelbarrow \"without a word.\""},{"t":"They came to see the garden as shared and gave back to it.","why":"Correct. They bring a wheelbarrow, help with the soil, and leave things in the basket for others."},{"t":"They wanted the city to close the garden.","why":"Nothing supports this. More and more of them join in."}],"key":2},{"n":35,"skill":"infer","domain":"KID","pair":"B","lead":null,"stem":"Which sentence from the story best supports the answer to question 34?","options":[{"t":"\"We dragged and raked and filled bags while the neighbors watched from their stoops.\"","why":"This is the first week, when the neighbors only watched. It does not show how they felt by the end."},{"t":"\"It was empty every evening and still there every morning, and sometimes there was something new in it.\"","why":"Correct. The basket is not stolen, and neighbors put things into it. That shows they shared and gave back."},{"t":"\"I thought the basket would be stolen.\"","why":"This is what the narrator expected. It is not what the neighbors actually did."},{"t":"\"People used it to get rid of things they did not want: a mattress, a shopping cart, a television with a cracked face.\"","why":"This describes how people treated the lot before the garden. It shows the opposite of sharing."}],"key":1}]},{"id":"p8","part":2,"kind":"Science text","title":"Working Against the Clock","paras":["At three in the morning, a nurse on the night shift fights to keep her eyes open. She slept six hours the day before, and she drank coffee at midnight. So why does her body insist that it is time for bed?","The answer is a built-in timer called the circadian rhythm. Deep in the brain, a tiny cluster of thousands of nerve cells acts as a master clock. It runs on a cycle of about twenty-four hours, and it is set mainly by light. When evening comes and the light fades, the clock signals the body to release melatonin, a hormone that brings on sleepiness. Body temperature drops. Alertness sinks to its lowest point in the hours before dawn.","This system works well for people who are awake by day and asleep by night. For night workers, it creates a constant conflict. They must stay alert when the clock is telling the body to sleep. Then they must sleep when daylight is telling the clock to wake up. As a result, daytime sleep is usually shorter and lighter than sleep at night. Over time, the lost sleep adds up. Tired workers make more mistakes, and studies have linked years of night work to a higher risk of health problems such as heart disease.","The clock cannot be switched off, but it can be nudged. Bright light during the first half of a shift helps the brain stay alert. Wearing dark glasses on the trip home, if someone else is driving, keeps morning sunlight from sending a wake-up signal. A dark, cool, quiet bedroom makes daytime sleep deeper. Experts also advise keeping sleep times as steady as possible, even on days off, so the clock is not reset again and again."],"questions":[{"n":36,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"Which statement best expresses the central idea of the passage?","options":[{"t":"Hospitals should stop asking nurses to work at night because the work is too dangerous for their health.","why":"Not in the text. The passage explains the problem and gives ways to cope. It does not call for ending night work."},{"t":"Coffee is the most effective way to stay awake during a night shift.","why":"The nurse in paragraph 1 drank coffee and was still sleepy."},{"t":"Melatonin is a hormone that brings on sleepiness.","why":"Too narrow. This is one detail from paragraph 2."},{"t":"Night work goes against the body's internal clock, but certain habits can reduce the strain.","why":"Correct. Paragraphs 2 and 3 explain the clock and the conflict. Paragraph 4 gives habits that help."}],"key":3},{"n":37,"skill":"main","domain":"KID","pair":null,"lead":null,"stem":"According to paragraph 3, why is daytime sleep usually shorter and lighter than sleep at night?","options":[{"t":"Night workers need less sleep than day workers do.","why":"Not in the text. The passage says lost sleep \"adds up,\" so they do need it."},{"t":"Night workers drink too much coffee during their shifts.","why":"Coffee appears only in paragraph 1. Paragraph 3 does not give it as the cause."},{"t":"Bedrooms are warmer during the day than at night.","why":"Paragraph 4 suggests a cool bedroom, but paragraph 3 gives daylight and the clock as the cause."},{"t":"Daylight is signaling the internal clock that it is time to be awake.","why":"Correct. \"Then they must sleep when daylight is telling the clock to wake up. As a result, daytime sleep is usually shorter and lighter.\""}],"key":3},{"n":38,"skill":"vocab","domain":"CS","pair":null,"lead":null,"stem":"Read this sentence from paragraph 4: \"The clock cannot be switched off, but it can be nudged.\" The word \"nudged\" most nearly means","options":[{"t":"pushed a little","why":"Correct. The word \"but\" sets up a contrast: you cannot turn the clock off, but you can move it a little with light, darkness, and routine."},{"t":"damaged","why":"The tips are meant to help the worker. Nothing is being harmed."},{"t":"stopped completely","why":"The sentence says the clock \"cannot be switched off.\" \"Nudged\" is contrasted with stopping."},{"t":"ignored","why":"The tips in paragraph 4 are actions that change the clock. They are the opposite of ignoring it."}],"key":0},{"n":39,"skill":"struct","domain":"CS","pair":null,"lead":null,"stem":"How is the passage as a whole organized?","options":[{"t":"It opens with a scene and a question, explains the cause of a problem, and then offers ways to reduce it.","why":"Correct. Paragraph 1 shows a tired nurse and asks why. Paragraphs 2 and 3 explain the clock and the conflict. Paragraph 4 gives solutions."},{"t":"It compares the advantages of night work and day work.","why":"No advantages of night work are given. The passage is not a comparison of two choices."},{"t":"It argues that night shifts should be made shorter.","why":"The passage informs and gives tips. It does not argue for shorter shifts."},{"t":"It tells the events of one nurse's night shift from start to finish.","why":"The nurse appears only in paragraph 1 as an example. The rest explains causes and solutions."}],"key":0}]}]}</script>

function parasHTML(paras){ return paras.map(function(t,i){ return '<p><span class="pn" aria-label="Paragraph '+(i+1)+'">'+(i+1)+'</span>'+esc(t)+'</p>'; }).join(''); }
function chartHTML(c){
  var narrow=window.innerWidth<620, W=narrow?360:520,H=narrow?290:292,l=narrow?34:54,r=narrow?6:12,t=narrow?34:18,b=58,pw=W-l-r,ph=H-t-b,n=c.bars.length,slot=pw/n,bw=Math.min(64,slot*.5);

  var bars='';

    var x=l+slot*i+(slot-bw)/2, top=y(d.value), h=t+ph-top, rr=Math.min(4,h);

    bars+='<text x="'+(x+bw/2)+'" y="'+(top-6)+'" text-anchor="middle" font-size="14" font-weight="900" fill="#202122">'+d.value+'</text>';
    bars+='<text x="'+(x+bw/2)+'" y="'+(t+ph+19)+'" text-anchor="middle" font-size="13.5" font-weight="700" fill="#202122">'+esc(d.label)+'</text>';
    bars+='<text x="'+(x+bw/2)+'" y="'+(t+ph+36)+'" text-anchor="middle" font-size="11.5" fill="#5d6676">'+esc(narrow&&d.subShort?d.subShort:d.sub)+'</text>';
  });
  var yl=narrow?'<text x="2" y="12" font-size="12" fill="#5d6676">'+esc(c.yLabel)+'</text>':'<text transform="translate(13,'+(t+ph/2)+') rotate(-90)" text-anchor="middle" font-size="12" fill="#5d6676">'+esc(c.yLabel)+'</text>';
  var xl='<text x="'+(l+pw/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="12" fill="#5d6676">Time the patient asked for</text>';
  var tbl='<div class="sr"><table><caption>'+esc(c.title)+'</caption><tr><th>Time requested</th><th>'+esc(c.yLabel)+'</th></tr>'+c.bars.map(function(d){ return '<tr><td>'+esc(d.label)+' ('+esc(d.sub)+')</td><td>'+d.value+'</td></tr>'; }).join('')+'</table></div>';
  return '<figure class="chart"><figcaption>'+esc(c.title)+'</figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart. '+esc(c.title)+'. '+c.bars.map(function(d){return d.label+' '+d.value;}).join(', ')+'.">'+g+bars+yl+xl+'</svg>'+tbl+'</figure>';
}
function passageHTML(p){
  var h='<div class="pkind">'+esc(p.kind)+'</div><div class="ptitle">'+esc(p.title)+'</div>';
  if (p.intro) h+='<div class="pintro">'+esc(p.intro)+'</div>';

  if (p.paras){

}
function parasHTMLRange(paras,a,b){ var o=''; for (var i=a;i<b;i++) o+='<p><span class="pn" aria-label="Paragraph '+(i+1)+'">'+(i+1)+'</span>'+esc(paras[i])+'</p>'; return o; }

  var h='<div class="wrap"><div class="hero"><span class="gold">TABE PREP · PRACTICE · NOT GRADED</span><h1>TABE Reading Mock Test</h1><p>Built like the real TABE 13&amp;14 Reading test, Level D: 39 questions, two parts, 50 minutes each, on a computer.</p></div>';

    h+='<div class="handin"><b>You have a test in progress.</b> '+esc(MODES[S.mode].label)+', Part '+curPart()+(S.phase==='break'?' is ready to start':', question '+qs[Math.min(S.qi,qs.length-1)].n+(S.timed?', '+mmss(left)+' left':''))+'.<br><button class="btn goldb" data-act="resume">Resume my test</button> <button class="btn ghost" data-act="discard">Start over</button></div>';

  h+='<div class="card"><span class="ptag">STEP 1</span><h2>Pick your program</h2><p style="margin:4px 0 0">Each BEOC program needs a different TABE Reading score. Tap yours to see your target.</p><div class="pick two">';

    var a=S.ans[q.n], ok=a===q.key;
    if (filter==='missed' && ok) return; if (filter==='flagged' && !S.flag[q.n]) return;
    h+='<details class="rq"><summary><span class="n">'+q.n+'</span><span>'+esc(q.p.title)+'</span><span class="sk">'+esc(SK[q.skill].name)+'</span><span class="res '+(ok?'ok':a==null?'na':'no')+'">'+(ok?'✓ Correct':a==null?'Not answered':'✗ Missed')+'</span></summary><div class="rbody">'
      +'<div class="stem">'+esc(q.stem)+'</div>';
    q.options.forEach(function(o,i){ var right=i===q.key, mine=i===a;
      h+='<div class="ropt'+(right?' right':'')+(mine?' mine':'')+(mine&&!right?' wrong':'')+'"><b>'+L[i]+'.</b> '+esc(o.t)+(right?'<span class="tag c">Correct answer</span>':'')+(mine?'<span class="tag y">Your answer</span>':'')+'<span class="why">'+esc(o.why)+'</span></div>'; });
    h+='<details class="pshow"><summary>Show the passage</summary>'+passageHTML(q.p)+'</details></div></details>';
  });
  document.getElementById('rlist').innerHTML=h||'<p class="fine">Nothing in this list.</p>';
}

/* ───────────── events ───────────── */
function render(){ if(S.phase==='test') renderTest(); else if(S.phase==='review') renderReview(); else if(S.phase==='break') renderBreak(); else if(S.phase==='results') renderResults(); else renderStart(); }
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-act]'); if(!b) { if(veil && e.target===veil && !veil.dataset.locked) closeModal(); return; }
  var act=b.dataset.act, k=b.dataset.k, q;
  switch(act){
    case 'goal': S.goal=k; save(); try { localStorage.setItem(GKEY,k); } catch (err) {} app.querySelectorAll('[data-act=goal]').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.k===k); }); document.getElementById('goalline').innerHTML=goalLine(); break;
    case 'mode': S.mode=k; save(); app.querySelectorAll('[data-act=mode]').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.k===k); }); break;
    case 'timed': S.timed=(k==='1'); save(); app.querySelectorAll('[data-act=timed]').forEach(function(x){ x.setAttribute('aria-pressed', (x.dataset.k==='1')===S.timed); }); break;
    case 'start':
      if(!S.goal){ var m=document.getElementById('startmsg'); m.textContent='Pick your program in Step 1 first.'; m.style.color='#b00020'; m.style.fontWeight='700'; app.querySelector('[data-act=goal]').focus(); break; }
      var keep={ mode:S.mode, goal:S.goal, timed:S.timed, big:S.big, name:S.name }; S=fresh(); for(var kk in keep) S[kk]=keep[kk];
      S.phase='test'; resume=false; mtab='p'; save(); renderTest(); startTimer(); intoView(true); break;
    case 'resume': resume=false; if(S.phase==='break') renderBreak(); else { render(); startTimer(); intoView(true); } break;
    case 'discard': var kp={ goal:S.goal, name:S.name }; S=fresh(); S.goal=kp.goal; S.name=kp.name; resume=false; save(); renderStart(); break;
    case 'startpart': S.phase='test'; mtab='p'; save(); renderTest(); startTimer(); intoView(true); break;
    case 'back': go(S.qi-1); break;
    case 'next': if(S.qi===curQs().length-1){ S.phase='review'; save(); renderReview(); } else go(S.qi+1); break;
    case 'goto': if(S.phase==='review'){ S.phase='test'; S.qi=+b.dataset.i; mtab='q'; save(); renderTest(); } else go(+b.dataset.i); break;
    case 'review': S.phase='review'; save(); renderReview(); break;
    case 'flag': q=curQ(); if(S.flag[q.n]) delete S.flag[q.n]; else S.flag[q.n]=1; save(); paintQuestion(false); break;
    case 'strike': q=curQ(); var i=+b.dataset.i, st=S.strike[q.n]||(S.strike[q.n]=[false,false,false,false]); st[i]=!st[i]; if(st[i]&&S.ans[q.n]===i) delete S.ans[q.n]; save(); paintQuestion(false); break;
    case 'big': S.big=!S.big; save(); document.body.classList.toggle('big',S.big); b.setAttribute('aria-pressed',S.big); break;
    case 'hidetimer': S.hideTimer=!S.hideTimer; save(); paintTimer(); break;
    case 'tab': mtab=k; paintTabs(); break;
    case 'endpart': askEnd(); break;
    case 'closemodal': closeModal(); break;
    case 'confirmend': endPart(); break;
    case 'filter': filter=k; paintReviewList(); break;
    case 'newtest': var k2={ goal:S.goal, name:S.name, big:S.big }; S=fresh(); S.goal=k2.goal; S.name=k2.name; S.big=k2.big; save(); renderStart(); intoView(true); break;
    case 'print': app.querySelectorAll('details.rq').forEach(function(d){ d.open=true; }); window.print(); break;
  }
});
document.addEventListener('change', function(e){
  if(e.target.name==='q'){ var q=curQ(), i=+e.target.value; S.ans[q.n]=i; if(S.strike[q.n]) S.strike[q.n][i]=false; save(); paintQuestion(false); var r=app.querySelector('input[name=q][value="'+i+'"]'); if(r) r.focus(); }
});
document.addEventListener('input', function(e){ if(e.target.id==='nm'){ S.name=e.target.value; save(); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && veil && !veil.dataset.locked) closeModal(); });

if (resume || S.phase==='start') renderStart(); else render();
})();
</script>
