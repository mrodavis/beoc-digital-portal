<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABE Reading Power Review | BEOC Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--ink:#202122;--navy:#0f2a52;--navy2:#1b3a6b;--blue:#26518f;--gold:#d4a72c;--gold2:#ffd766;--soft:#eef3fb;--muted:#5d6676;--cream:#fdf6e3;--okbg:#e6f4ea;--ok:#1e7e34;--line:#d7e0ef;--badbg:#fdecea;--bad:#b00020;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Lato,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 70px;}
.hero{background:linear-gradient(135deg,#0f2a52 0%,#26518f 100%);color:#fff;border-radius:0 0 18px 18px;padding:30px 26px 24px;margin:0 -16px 18px;}
.hero h1{margin:0 0 6px;font-size:27px;line-height:1.25;}
.hero p{margin:0;color:#d9e4f5;}
.hero .meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{background:rgba(255,255,255,.14);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.gold{display:inline-block;background:var(--gold);color:#1b2a44;font-weight:900;border-radius:999px;padding:3px 14px;font-size:13px;letter-spacing:1.5px;margin-bottom:10px;}
.gold.new{background:#fff;color:#7a5a12;box-shadow:0 0 0 2px var(--gold) inset}
.scorebar{position:sticky;top:0;z-index:50;background:var(--navy2);color:#fff;border-radius:12px;padding:10px 18px;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center;gap:6px 16px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,42,82,.25);}
.scorebar b{color:var(--gold2);}
.scorebar .bar{flex-basis:100%;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.scorebar .bar i{display:block;height:100%;background:var(--gold2);border-radius:4px;transition:width .3s}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(27,58,107,.08);padding:20px 22px;margin:0 0 20px;border-top:5px solid var(--blue);}
.card h2{margin:0 0 4px;color:var(--navy2);font-size:20px;}
.card.learn{border-top-color:var(--gold);}
.card.done{border-top-color:var(--ok)}
.ptag{display:inline-block;background:var(--soft);color:var(--blue);font-weight:900;border-radius:8px;padding:2px 10px;font-size:13px;letter-spacing:1px;margin-bottom:6px;}
.card.done .ptag{background:var(--okbg);color:var(--ok)}
.prompt{margin:4px 0 10px}
.notebook{background:var(--cream);border-left:4px solid var(--gold);padding:8px 14px;border-radius:6px;margin:10px 0;font-size:15px;}
.handin{background:linear-gradient(135deg,#7a5a12,#b8860b);color:#fff;border-radius:14px;padding:16px 22px;margin:0 0 20px;}
.handin b{color:#ffe9b3}
.passage{background:#f4f7fb;border-radius:10px;padding:14px 18px;color:#32333a;margin:8px 0 12px;border-left:4px solid #9db3d6}
.btn{background:var(--navy2);color:#fff;border:2px solid var(--navy2);border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy2);}
.btn.ghost:hover{background:var(--soft)}
.btn.goldb{background:var(--gold);border-color:var(--gold);color:#1b2a44}
:focus-visible{outline:3px solid #f0a500;outline-offset:2px;}
/* home grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:0;border-top:5px solid var(--blue);border-radius:14px;box-shadow:0 2px 10px rgba(27,58,107,.08);padding:16px 18px;cursor:pointer;min-height:150px}
.tile:hover{box-shadow:0 6px 18px rgba(27,58,107,.18)}
.tile.new{border-top-color:var(--gold)}
.tile.done{border-top-color:var(--ok)}
.tile .n{font-size:13px;font-weight:900;letter-spacing:1px;color:var(--blue)}
.tile.new .n{color:#7a5a12}
.tile b{font-size:19px;color:var(--navy2);line-height:1.25;margin:2px 0 4px}
.tile small{color:var(--muted);font-size:14.5px;line-height:1.4}
.tile .foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.tile .pbar{flex:1;height:8px;background:var(--soft);border-radius:4px;margin:0 10px;overflow:hidden}
.tile .pbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.tile.done .pbar i{background:var(--ok)}
.tile.done .foot{color:var(--ok)}
/* learn */
.learn ul,.learn ol{margin:8px 0;padding-left:22px}.learn li{margin:5px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.facts div{background:var(--soft);border-radius:12px;padding:10px 12px;text-align:center}
.facts b{display:block;font-size:34px;line-height:1.1;color:var(--navy2)}
.facts span{font-size:14px;color:var(--muted);line-height:1.3;display:block}
.traps{background:var(--cream);border-left:4px solid var(--gold);border-radius:6px;padding:10px 14px;margin:12px 0 4px}
.traps>b{display:block;color:#5c4308;margin-bottom:4px}
.traps span{display:block;margin:3px 0}
.traps i{font-style:normal;font-weight:900;font-size:12.5px;letter-spacing:.8px;background:#fff;border:1px solid var(--gold);border-radius:6px;padding:1px 7px;margin-right:6px;color:#5c4308;white-space:nowrap}
.formula{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.formula span{background:var(--soft);border:2px solid #9db3d6;border-radius:10px;padding:6px 12px;font-weight:900;color:var(--navy2);font-size:15px}
.formula span.g{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.formula b{font-size:22px;color:var(--blue)}
table.mini{border-collapse:collapse;width:100%;margin:10px 0;font-size:15.5px}
table.mini th{background:var(--navy2);color:#fff;text-align:left;padding:6px 10px;font-size:14px}
table.mini td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
table.mini td:first-child{font-weight:900;color:var(--navy2);white-space:nowrap}
.parts3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.parts3 div{border-radius:12px;padding:10px 14px;background:var(--soft);border-top:4px solid var(--blue)}
.parts3 b{display:block;color:var(--navy2);letter-spacing:1px}
.parts3 span{font-size:15px;line-height:1.4;display:block}
.example{background:#f4f7fb;border-radius:10px;padding:12px 16px;margin:10px 0;line-height:2}
.lab{font-size:12px;font-weight:900;letter-spacing:.8px;border-radius:6px;padding:2px 7px;color:#fff;margin-right:2px;white-space:nowrap}
.lab.c{background:var(--navy2)}.lab.r{background:#6b4fa0}.lab.e{background:var(--ok)}
ol.steps{counter-reset:s;list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
ol.steps li{counter-increment:s;background:var(--soft);border-radius:12px;padding:10px 14px 10px 46px;position:relative;margin:0;font-size:15.5px;line-height:1.4}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;line-height:26px;text-align:center;background:var(--blue);color:#fff;border-radius:50%;font-weight:900}
ol.steps li b{display:block;color:var(--navy2);letter-spacing:.8px}
/* sort */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:20px}
.item{background:#fff;border:2px solid var(--blue);color:var(--navy2);border-radius:12px;padding:8px 14px;font-weight:700;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;text-align:left;line-height:1.4;max-width:100%}
.item.chip{border-radius:999px;padding:6px 14px}
.item.sel{background:var(--blue);color:#fff;box-shadow:0 0 0 3px var(--gold2)}
.item.dragging{opacity:.35}
.item.extra{border-style:dashed;border-color:#9aa5b8;color:var(--muted);cursor:default}
.dragghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 10px 26px rgba(15,42,82,.35);transform:rotate(-2deg);margin:0}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.buckets.paras{grid-template-columns:1fr}
.bucket{border:2px dashed #9db3d6;border-radius:12px;padding:10px 12px;background:#f8fafd;cursor:pointer;text-align:left;width:100%;display:block;min-height:74px}
.bucket:hover,.bucket.over{background:var(--soft);border-color:var(--blue)}
.bucket.over{border-style:solid;box-shadow:0 0 0 3px var(--gold2)}
.bucket>b{color:var(--navy2);letter-spacing:.6px}
.bucket>small{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.bucket .ptxt{display:block;margin:4px 0 6px;color:#32333a}
.bucket .slot{display:block;border:2px dashed #c3cfe3;border-radius:999px;padding:3px 12px;color:var(--muted);font-size:14px;width:max-content;max-width:100%}
.placed{display:block;background:var(--okbg);border:2px solid var(--ok);color:var(--ok);border-radius:10px;padding:5px 10px;font-weight:700;margin-top:6px;font-size:15.5px;line-height:1.4}
.placed.chip{display:inline-block;border-radius:999px;margin-right:6px}
.bucket.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.fb{border-radius:8px;padding:9px 14px;margin:10px 0 2px;font-size:15.5px;min-height:20px}
.fb.ok{background:var(--okbg);color:#14561f}
.fb.no{background:var(--badbg);color:#7d0017}
.fb.info{background:var(--soft);color:var(--navy2)}
.fb:empty{display:none}
.count{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.5px}
/* mc */
.stem{font-weight:700;margin:6px 0 8px}
.opt{display:block;width:100%;text-align:left;background:#f6f8fc;border:2px solid var(--line);border-radius:10px;padding:9px 14px;margin:6px 0;cursor:pointer;}
.opt:hover:not(:disabled){border-color:var(--blue);}
.opt .l{font-weight:900;color:var(--blue);margin-right:8px}
.opt.right{background:var(--okbg);border-color:var(--ok);}
.opt.wrong{background:var(--badbg);border-color:var(--bad);}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .why{display:block;font-size:15px;color:#33415a;margin-top:3px;font-weight:400}
.locked{background:#f4f7fb;border-radius:10px;padding:10px 14px;color:var(--muted);margin-top:10px}
/* tap */
.units{margin:10px 0}
.unit{display:block;width:100%;text-align:left;background:#f6f8fc;border:2px solid var(--line);border-radius:10px;padding:9px 14px;margin:6px 0;cursor:pointer}
.unit:hover:not(:disabled){border-color:var(--blue)}
.unit.hit{background:var(--okbg);border-color:var(--ok)}
.unit.miss{background:var(--badbg);border-color:var(--bad)}
.unit:disabled{cursor:default;color:var(--ink)}
.ask{background:var(--navy2);color:#fff;border-radius:10px;padding:10px 14px;margin:8px 0;font-weight:700}
.ask small{display:block;color:var(--gold2);font-weight:900;letter-spacing:1px;font-size:12.5px}
.sentence{background:#f4f7fb;border-radius:10px;padding:14px 16px;line-height:2.5;margin:8px 0}
.chunk{display:inline;background:#fff;border:2px solid var(--line);border-radius:8px;padding:4px 8px;margin:0 2px;cursor:pointer;line-height:1.5}
.chunk:hover:not(:disabled){border-color:var(--blue)}
.chunk.word{background:var(--gold2);border-color:var(--gold);font-weight:900;cursor:default}
.chunk.hit{background:var(--okbg);border-color:var(--ok);font-weight:700}
.chunk.miss{background:var(--badbg);border-color:var(--bad)}
.words{background:#f4f7fb;border-radius:10px;padding:14px 16px;line-height:2.3;margin:8px 0}
.w{background:none;border:0;border-bottom:2px solid transparent;border-radius:6px;padding:2px 3px;cursor:pointer}
.w:hover:not(:disabled){background:#fff;border-bottom-color:var(--blue)}
.w.hit{background:var(--gold2);font-weight:900;border-bottom-color:var(--gold)}
.w.miss{background:var(--badbg)}
.w:disabled{cursor:default;color:var(--ink)}
/* chart + table */
figure.chart{margin:8px 0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px 6px}
.ctitle{display:block;width:100%;background:none;border:2px solid transparent;border-radius:8px;font-weight:900;color:var(--navy2);font-size:15.5px;line-height:1.35;text-align:left;padding:4px 6px;cursor:pointer}
.ctitle:hover{border-color:var(--line)}
.ctitle.hit{background:var(--okbg);border-color:var(--ok)}
.ctitle.miss{background:var(--badbg);border-color:var(--bad)}
figure.chart svg{width:100%;height:auto;display:block;max-width:620px;margin:0 auto}
.bar{cursor:pointer}
.bar .hitbox{fill:transparent}
.bar:hover .hitbox{fill:#eef3fb}
.bar.hit .hitbox{fill:#e6f4ea}
.bar.miss .hitbox{fill:#fdecea}
.bar:focus-visible .hitbox{stroke:#f0a500;stroke-width:3}
.bar:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tblwrap{overflow-x:auto}
table.data{border-collapse:separate;border-spacing:4px;width:100%;margin:8px 0}
table.data caption{font-weight:900;color:var(--navy2);text-align:left;padding:2px 4px 6px}
table.data th{background:var(--navy2);color:#fff;padding:7px 10px;border-radius:8px;font-size:15px;text-align:left}
table.data th[scope=row]{background:var(--soft);color:var(--navy2)}
table.data td{padding:0}
.cell{display:block;width:100%;background:#f6f8fc;border:2px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.cell:hover{border-color:var(--blue)}
.cell.hit{background:var(--okbg);border-color:var(--ok);font-weight:900}
.cell.miss{background:var(--badbg);border-color:var(--bad)}
/* flip + checklist + goal */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.flipc{min-height:128px;border-radius:12px;border:2px solid var(--blue);background:var(--navy2);color:#fff;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center}
.flipc b{font-size:19px;line-height:1.3}
.flipc small{color:var(--gold2);font-weight:900;letter-spacing:1px;font-size:12px;margin-top:6px}
.flipc.on{background:#fff;color:var(--ink);border-color:var(--gold)}
.flipc.on small{color:#7a5a12}
.tick{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#f6f8fc;border:2px solid var(--line);border-radius:10px;padding:9px 14px;margin:6px 0;cursor:pointer}
.tick .box{flex:none;width:24px;height:24px;border:2px solid var(--blue);border-radius:6px;background:#fff;text-align:center;line-height:20px;font-weight:900;color:#fff}
.tick[aria-pressed=true]{background:var(--okbg);border-color:var(--ok)}
.tick[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.choice{display:block;width:100%;text-align:left;background:#f6f8fc;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;}
.choice:hover{border-color:var(--blue)}
.choice[aria-pressed=true]{background:var(--soft);border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);}
.choice b{color:var(--navy2);display:block;line-height:1.3}
.choice small{color:var(--muted);font-size:14px}
.target{background:var(--navy2);color:#fff;border-radius:12px;padding:12px 18px;margin-top:12px;}
.target b{color:var(--gold2)}
.snav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fine{color:var(--muted);font-size:14px}
@media (max-width:600px){.scorebar{font-size:14.5px;padding:7px 12px;border-radius:0 0 12px 12px}.scorebar span:nth-child(3){display:none}body{font-size:16.5px}.hero h1{font-size:23px}.card{padding:16px 16px}table.mini{font-size:14.5px}table.mini td:first-child{white-space:normal}}
@media (prefers-reduced-motion:reduce){.bucket.shake{animation:none}.scorebar .bar i{transition:none}}
</style>

<style id="beoc-port-styles">
#beoc-topbar{all:initial;display:block;box-sizing:border-box;font-family:Lato,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.4;background:#0f172a;color:#e2e8f0;margin:0 0 16px;border-radius:0 0 10px 10px;}
#beoc-topbar *{box-sizing:border-box;font-family:inherit;}
#beoc-topbar .beoc-tb-inner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;max-width:1100px;margin:0 auto;padding:10px 16px;}
#beoc-topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;}
#beoc-topbar a:hover,#beoc-topbar a:focus-visible{text-decoration:underline;}
#beoc-topbar a:focus-visible{outline:2px solid #fbbf24;outline-offset:2px;border-radius:4px;}
#beoc-topbar .beoc-tb-home{display:inline-flex;align-items:center;gap:8px;}
#beoc-topbar .beoc-tb-badge{display:inline-block;background:#0f766e;color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:900;letter-spacing:.06em;}
#beoc-topbar .beoc-tb-link{color:#bfdbfe;}
#beoc-topbar .beoc-tb-note{margin-left:auto;color:#94a3b8;font-size:12.5px;}
@media (max-width:640px){#beoc-topbar .beoc-tb-note{margin-left:0;width:100%;}}
.beoc-bs-note{display:inline-block;background:#fff7e0;color:#5a4300;border:1px solid #e0a800;border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;line-height:1.35;text-decoration:none;}
.beoc-bs-inline{font-weight:700;}
.beoc-bs-tag{font-size:.9em;opacity:.85;}
@media print{#beoc-topbar{display:none;}}
</style>
</head>
